<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sasitha Ruvin activity</title>
<style>
:root{color-scheme:light;--bg:#fffaf0;--card:#f6ecd9;--ink:#1d1918;--sub:#6b5d51;--line:#dccdb3;--r0:#e8dcc4;--r1:#f0c9a4;--r2:#ee9b76;--r3:#e2604d;--r4:#3a2a28;--s0:#d9503f;--s1:#00908a;--s2:#d99a1c;--s3:#7a56a8;--s4:#6f8f2f;--o:#a3937f}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f0c0b;--card:#1b1716;--ink:#f6ecd9;--sub:#b5a592;--line:#3b322e;--r0:#3b322e;--r1:#6b352d;--r2:#a8483a;--r3:#e8604c;--r4:#f9d9a8;--s0:#e8604c;--s1:#00a198;--s2:#bd8110;--s3:#9a78cc;--s4:#7c9c38;--o:#85776a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:1080px;margin:auto;padding:40px 16px 64px}h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.04em;line-height:1.1;margin:0}h2{font-size:19px;margin:0 0 14px}a{color:inherit}.sub{color:var(--sub)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;margin:32px 0}.tiles b{display:block;font-size:38px;line-height:1.1;letter-spacing:-.03em}.tiles.big b{font-size:60px}.tiles small{color:var(--sub);font-size:14px;display:block}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:20px;min-width:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:760px){.two{grid-template-columns:minmax(0,1fr);gap:0}}
.bar{display:flex;flex-wrap:wrap;gap:10px 24px;margin:36px 0 0}.seg{display:flex;flex-wrap:wrap;gap:4px}button{font:inherit;font-size:14px;min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--s0);outline-offset:2px}
.scroll{overflow-x:auto}svg{display:block;width:100%}svg text{fill:var(--sub);font-size:12px}.hit:hover,.hit:focus{opacity:.75}.legend{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}.legend i,.tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.lang{display:grid;grid-template-columns:1fr auto;margin-bottom:13px}.lang span:last-of-type{color:var(--sub)}.lang div{grid-column:1/-1;height:9px;border-radius:5px;background:var(--r0);margin-top:4px}.lang div i{display:block;height:100%;border-radius:5px;transition:width .4s}
.tip{position:fixed;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;box-shadow:0 6px 20px #0003;display:none;z-index:9;max-width:240px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}summary{cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><div class="sub">GitHub activity. <span id="upd"></span> <a href="https://github.com/Sasitha-Ruvin">Profile</a></div>
<picture><source media="(prefers-color-scheme: dark)" srcset="assets/scene-dark.svg"><img src="assets/scene-light.svg" alt="Current contribution streak" style="display:block;width:100%;margin-top:24px"></picture>
<section><div style="display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;margin-bottom:12px"><h2 id="calh" style="margin:0"></h2><div class="seg" id="years"></div></div><div class="scroll" id="cal"></div></section>
<div class="bar"><div class="seg" id="scope" role="group" aria-label="Repositories"></div><div class="seg" id="range" role="group" aria-label="Time range"></div></div>
<section><h2>Commits per month, by language</h2><div class="legend" id="leg"></div><div class="scroll" id="months"></div></section>
<div class="two"><section><h2>Languages</h2><div id="langs"></div></section><section><h2>When I commit, all time</h2><div class="scroll" id="hours"></div><p class="sub" style="font-size:14px;margin-bottom:0">Colombo time</p></section></div>
<section><details><summary>Data table</summary><div class="scroll" id="table"></div></details></section>
</main><div class="tip" id="tip"></div><script>
const L=['TypeScript','Go','JavaScript','HTML','Kotlin'],$=i=>document.getElementById(i),f=n=>Math.round(n).toLocaleString('en-US'),
esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),col=l=>L.includes(l)?`var(--s${L.indexOf(l)})`:'var(--o)',
dt=(d,o={month:'short',day:'numeric',year:'numeric'})=>new Date(d).toLocaleDateString('en-US',{...o,timeZone:'UTC'});
const tip=$('tip'),show=(e,el)=>{const r=el.getBoundingClientRect(),x=e.clientX??r.left,y=e.clientY??r.top;tip.innerHTML=el.dataset.t;tip.style.display='block';tip.style.left=Math.max(8,Math.min(x+14,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(y+18+tip.offsetHeight>innerHeight?y-tip.offsetHeight-10:y+18)+'px'},hide=()=>tip.style.display='none';
for(const ev of['pointermove','focusin'])document.addEventListener(ev,e=>{const el=e.target.closest?.('[data-t]');el?show(e,el):hide()});document.addEventListener('focusout',hide);document.addEventListener('scroll',hide,true);
const pick=(id,opts,val,cb)=>{$(id).innerHTML=opts.map(([k,l])=>`<button data-k="${k}" aria-pressed="${k==val}">${l}</button>`).join('');$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;for(const o of $(id).children)o.setAttribute('aria-pressed',o===b);cb(b.dataset.k)}};
let D,scope='all',range='12',off=new Set;
fetch('stats.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=d;init()}).catch(()=>$('upd').textContent='Stats could not be loaded. Reload to try again.');
function init(){$('upd').textContent=`Updated ${dt(D.updated)}.`;
const ys=[];for(let y=+D.updated.slice(0,4);y>=+D.calendar.from.slice(0,4);y--)ys.push([y,y]);pick('years',ys,ys[0][0],cal);cal(ys[0][0]);
pick('scope',[['all','All repos'],['mine','All personal'],['public','Personal public'],['private','Personal private'],['org','Organizations']],scope,k=>{scope=k;draw()});
pick('range',[['3','3 months'],['12','12 months'],['all','All time']],range,k=>{range=k;draw()});
$('leg').onclick=e=>{const b=e.target.closest('button');if(b){off.has(b.dataset.l)?off.delete(b.dataset.l):off.add(b.dataset.l);const l=b.dataset.l;draw();[...$('leg').children].find(x=>x.dataset.l===l)?.focus()}};draw()}
function cal(y){const a=Date.UTC(y,0,1),from=Date.parse(D.calendar.from),pad=new Date(a).getUTCDay(),end=Math.min(Date.UTC(y,11,31),Date.parse(D.updated));let h='',tot=0;
for(let d=a,i=pad;d<=end;d+=864e5,i++){const v=D.calendar.counts[(d-from)/864e5]||0,w=Math.floor(i/7),D8=new Date(d);tot+=v;if(D8.getUTCDate()===1)h+=`<text x="${w*18}" y="12">${dt(d,{month:'short'})}</text>`;h+=`<rect class="hit" x="${w*18}" y="${20+i%7*18}" width="15" height="15" rx="3" fill="var(--r${!v?0:v<3?1:v<6?2:v<10?3:4})" data-t="<b>${v} contribution${v===1?'':'s'}</b><br>${dt(d)}"/>`}
$('calh').textContent=`${f(tot)} contributions in ${y}`;$('cal').innerHTML=`<svg viewBox="0 0 955 148" style="min-width:820px" role="img" aria-label="Contribution calendar ${y}">${h}</svg>`;if(y==D.updated.slice(0,4))$('cal').scrollLeft=1e4}
function draw(){const G={all:['public','private','org'],mine:['public','private']}[scope]||[scope];
const keys=[],first=Object.keys(D.months).sort()[0],e=new Date(D.updated);for(let i=0;i<240;i++){const k=new Date(Date.UTC(e.getUTCFullYear(),e.getUTCMonth()-i,1)).toISOString().slice(0,7);if(k<first||(range!=='all'&&i>=+range))break;keys.unshift(k)}
const tot={},rows=keys.map(k=>{const r={};let n=0;for(const g of G){const c=D.months[k]?.[g];if(!c)continue;n+=c.commits;for(const[l,v]of Object.entries(c.langs)){tot[l]=(tot[l]||0)+v;const q=L.includes(l)?l:'Other';r[q]=(r[q]||0)+v}}return{k,r,n}});
const names=[...L,'Other'].filter(l=>rows.some(x=>x.r[l]>0)),vis=names.filter(l=>!off.has(l));
$('leg').innerHTML=names.map(l=>`<button data-l="${l}" aria-label="${l}, ${off.has(l)?'hidden':'shown'}" style="opacity:${off.has(l)?.45:1}" title="Show or hide ${l}"><i style="background:${col(l)}"></i>${l}</button>`).join('');
const max=Math.max(1,...rows.map(x=>vis.reduce((s,l)=>s+(x.r[l]||0),0))),bw=1000/(rows.length||1),w=Math.min(54,bw*.68),every=Math.ceil(rows.length/14);let h='';
for(const p of[.5,1])h+=`<line x1="30" x2="1030" y1="${230-p*200}" y2="${230-p*200}" stroke="var(--line)"/><text x="0" y="${234-p*200}">${f(max*p)}</text>`;
rows.forEach((x,i)=>{let y=230,s='';const cx=30+i*bw+bw/2;for(const l of vis){const q=(x.r[l]||0)/max*200;if(q<.5)continue;y-=q;s+=`<rect x="${cx-w/2}" y="${y}" width="${w}" height="${Math.max(1,q-2)}" rx="2" fill="${col(l)}"/>`}
const tt=`<b>${dt(x.k+'-01',{month:'long',year:'numeric'})}</b><br>${x.n} commits`+vis.filter(l=>x.r[l]>=.05).sort((a,b)=>x.r[b]-x.r[a]).map(l=>`<br><i style='background:${col(l)}'></i>${l} ${x.r[l].toFixed(1)}`).join('');
h+=`<g class="hit" tabindex="0" data-t="${tt}"><rect x="${cx-bw/2}" y="20" width="${bw}" height="212" fill="transparent"/>${s}</g>`;if(i%every===0)h+=`<text x="${cx}" y="252" text-anchor="middle">${dt(x.k+'-01',rows.length>12?{month:'short',year:'2-digit'}:{month:'short'})}</text>`});
$('months').innerHTML=`<svg viewBox="0 0 1030 260" style="min-width:640px">${h}<line x1="30" x2="1030" y1="230" y2="230" stroke="var(--line)"/></svg>`;
$('months').scrollLeft=1e4;const sum=Object.values(tot).reduce((a,b)=>a+b,0)||1,list=Object.entries(tot).sort((a,b)=>b[1]-a[1]);
$('langs').innerHTML=list.slice(0,10).map(([l,v])=>{const p=v/sum*100;return`<div class="lang" tabindex="0" data-t="<b>${esc(l)}</b><br>${p.toFixed(1)}%, about ${v.toFixed(1)} commits"><span>${esc(l)}</span><span>${p<1?'&lt;1':Math.round(p)}%</span><div><i style="width:${p}%;min-width:8px;background:${col(l)}"></i></div></div>`}).join('')||'<p class="sub">No commits here in this period.</p>';
const H=Array(168).fill(0);for(const g of G)(D.hours[g]||[]).forEach((v,i)=>H[i]+=v);const hm=Math.max(1,...H),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
$('hours').innerHTML=`<svg viewBox="0 0 500 190" style="min-width:400px">${days.map((d,r)=>`<text x="0" y="${15+r*23}">${d}</text>`+Array.from({length:24},(_,c)=>{const v=H[r*24+c];return`<rect class="hit" x="${34+c*19.4}" y="${2+r*23}" width="17" height="20" rx="3" fill="var(--r${v?Math.min(4,1+Math.floor(v/hm*4)):0})" data-t="<b>${v} commits</b><br>${d} ${c}:00 to ${c+1}:00"/>`}).join('')).join('')}${[0,6,12,18].map(c=>`<text x="${34+c*19.4}" y="182">${c}:00</text>`).join('')}</svg>`;
$('table').innerHTML=`<table><tr><th>Language</th><th>Commits</th><th>Share</th></tr>${list.map(([l,v])=>`<tr><td>${esc(l)}</td><td>${v.toFixed(1)}</td><td>${(v/sum*100).toFixed(1)}%</td></tr>`).join('')}</table>`}
</script></body></html>
